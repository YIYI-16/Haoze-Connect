<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户端下载中心</title>
    <!-- CSS 或 JS 更新时同步递增版本号，避免 CDN 混用新页面和旧资源。 -->
    <link rel="stylesheet" href="css/styles.css?v=20261028-4">
    <script src="js/config.js?v=20261028-4" defer></script>
    <script src="js/main.js?v=20261028-4" defer></script>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="app-title">客户端下载</h1>
            <p class="subtitle" id="release-subtitle">选择对应平台的客户端，自动获取最新版本</p>
        </header>

        <main class="grid">
            <!-- Windows 卡片 -->
            <div class="card" id="card-win">
                <span class="badge">当前设备推荐</span>
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.9-1.801"/>
                </svg>
                <h2>Windows</h2>
                <span class="meta" id="win-meta">Windows 10 / 11 (x64)</span>
                <div class="download-options">
                    <a class="btn" id="win-link" aria-disabled="true" tabindex="-1" target="_blank" rel="noopener noreferrer">下载 Windows 安装版</a>
                    <a class="btn" id="win-portable-link" aria-disabled="true" tabindex="-1" target="_blank" rel="noopener noreferrer">下载 Windows 便携版</a>
                </div>
            </div>

            <!-- Android 卡片 -->
            <div class="card" id="card-android">
                <span class="badge">当前设备推荐</span>
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M17.523 15.3414c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993.0001.5511-.4482.9997-.9993.9997m-11.046 0c-.5511 0-.9993-.4486-.9993-.9997s.4482-.9993.9993-.9993c.5511 0 .9993.4482.9993.9993 0 .5511-.4482.9997-.9993.9997m11.4045-6.02l1.9973-3.4592a.416.416 0 00-.1521-.5676.416.416 0 00-.5676.1521l-2.0223 3.503C15.5902 8.2439 13.8533 7.8508 12 7.8508s-3.5902.3931-5.1367 1.0989L4.841 5.4467a.4161.4161 0 00-.5677-.1521.4157.4157 0 00-.1521.5676l1.9973 3.4592C2.6889 11.1867.3432 14.6589 0 18.761h24c-.3435-4.1021-2.6892-7.5743-6.1185-9.4396"/>
                </svg>
                <h2>Android</h2>
                <span class="meta" id="android-meta">Android 7.0+ (arm64-v8a)</span>
                <a class="btn" id="android-link" aria-disabled="true" tabindex="-1" target="_blank" rel="noopener noreferrer">下载 Android APK</a>
            </div>
        </main>

        <footer>
            <p id="release-status" role="status" aria-live="polite">正在获取最新版本…</p>
            <p><a id="releases-link" href="https://github.com/YIYI-16/Haoze-Connect/releases" target="_blank" rel="noopener noreferrer">前往 GitHub Releases</a></p>
            <p>已有账号？<a href="#" id="panel-link">返回控制面板</a></p>
        </footer>
    </div>
</body>
</html>

name: Haoze Connect Mihomo integration (artifacts only)

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [windows, android, all]
        default: windows
      source_ref:
        type: string
        default: flclash-prototype

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'
  RUSTUP_TOOLCHAIN: '1.99.0'
  GOFLAGS: '-buildvcs=false'

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
      - id: snapshot
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - working-directory: packages/haoze_xboard
        run: flutter pub get
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - run: flutter analyze --no-fatal-infos --no-pub
      - run: flutter test --no-pub test/features/haoze test/l10n test/lint test/providers/action_test.dart test/providers/system_action_test.dart test/providers/database_test.dart test/common/preferences_test.dart test/core/desktop test/core/service_test.dart test/core/protocol_contract_test.dart test/manager/core_manager_test.dart test/providers/state_derived_test.dart
      - working-directory: packages/haoze_xboard
        run: |
          flutter analyze --no-fatal-infos --no-pub
          flutter test --no-pub --reporter expanded

  windows:
    if: inputs.platform == 'windows' || inputs.platform == 'all'
    needs: checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.source_sha }}
          submodules: recursive
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - run: flutter pub get
      - name: Build account UI and Windows native runtime
        run: flutter build windows --release --no-pub --dart-define=APP_ENV=pre
      - name: Compile isolated panel probe
        working-directory: packages/haoze_xboard
        run: |
          flutter pub get
          dart compile exe bin/panel_probe.dart -o "$env:RUNNER_TEMP\HaozePanelProbe.exe"
      - name: Probe Windows native HTTPS
        continue-on-error: true
        run: .\tool\haoze_panel_probe_windows.ps1 -OutputPath "$env:RUNNER_TEMP\haoze-panel-native.json"
      - name: Probe standalone Dart HTTPS
        continue-on-error: true
        run: '& "$env:RUNNER_TEMP\HaozePanelProbe.exe" | Out-File -Encoding utf8 "$env:RUNNER_TEMP\haoze-panel-dart.json"'
      - name: Package integration preview
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "$env:RUNNER_TEMP\HaozeConnect-Mihomo-Preview-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: HaozeConnect-Mihomo-Preview-Windows-x64
          path: ${{ runner.temp }}/HaozeConnect-Mihomo-Preview-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Haoze-isolated-panel-probes
          path: |
            ${{ runner.temp }}/HaozePanelProbe.exe
            ${{ runner.temp }}/haoze-panel-native.json
            ${{ runner.temp }}/haoze-panel-dart.json
            tool/haoze_panel_probe_windows.ps1

  android:
    if: inputs.platform == 'android' || inputs.platform == 'all'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.source_sha }}
          submodules: recursive
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Pin the NDK used by Flutter native assets
        run: |
          sdkmanager 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: core/go.sum
      - run: |
          rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android
          rustup default 1.99.0
      - run: flutter pub get
      - name: Test Android account lifecycle gate
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest -Ptarget-platform=android-arm64 -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug
      - name: Build Android integration preview
        run: flutter build apk --release --no-pub --target-platform android-arm64 --split-per-abi --dart-define=APP_ENV=pre
      - uses: actions/upload-artifact@v4
        with:
          name: HaozeConnect-Mihomo-Preview-Android-arm64-debug-signed
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
